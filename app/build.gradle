plugins {
    id 'com.android.application'
}

android {
    compileSdk 35
    namespace = "com.weifu.app"
    defaultConfig {
        applicationId "com.weifu.momtt"
        minSdkVersion 21
        //noinspection OldTargetApi
        targetSdkVersion 33
        versionCode 13
        versionName "2.0.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // apk name def (new Variant API)
    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.outputs.each { output ->
                //在这里修改apk文件名
                output.outputFileName.set("${rootProject.name}-v${defaultConfig.versionName}-${variant.buildType}.apk")
            }
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.6.0'
    implementation 'androidx.navigation:navigation-ui:2.6.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation files('libs/PosPrinterSDK.jar')
    implementation files('libs/ZebraPrinter_Android_SDK_1.0.jar')
    implementation 'com.github.promeg:tinypinyin:1.0.0'
    implementation 'com.inuker.bluetooth:library:1.4.0'
    implementation 'com.symbol:emdk:9.1.1'
    implementation 'com.github.zzz40500:android-shapeLoadingView:1.0.3.2'
    implementation 'com.github.yuzhiqiang1993:zxing:2.2.9'
    // zxing-cpp（C++ 引擎）：主解码引擎。检测器/解码器对模糊、低对比、DM 刻印、
    // 一维码的识别率数倍于纯 Java zxing，1080p 全开 tryHarder/tryRotate/tryInvert
    // 仅需 30~80ms，是业界扫码 app 的标准选择
    implementation 'io.github.zxing-cpp:android:2.3.0'

    // ===== 新扫码插件（ScanPlugin）依赖 =====
    // zxing core 复用旧封装库（com.github.yuzhiqiang1993:zxing:2.2.9）内嵌的 libs/core-3.4.1.jar，
    // 显式依赖 core-3.5.x 会与其产生重复类冲突（checkDebugDuplicateClasses 失败）
    // CameraX（现代相机栈：预览旋转自动处理、生命周期感知）
    // 1.4.x：native 库（libimage_processing_util_jni.so）按 16 KB 页对齐编译，
    // 兼容 Android 15+ 的 16 KB 页设备；1.2.3 及以下仅 4 KB 对齐
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
}